[project]
name = "sns-automation"
version = "1.0.0"
description = "AI-powered SNS automation system for content creation, posting, and monetization"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "tweepy>=4.14.0",
    "instagrapi>=2.1.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.25.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0,<5",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "rich>=13.8.0",
    "click>=8.1.0",
    "slowapi>=0.1.9",
    "aiofiles>=23.2.1",
    "discord.py>=2.3.0",
]

[project.scripts]
sns = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 設定読み込み・ロガー初期化の後に import する構成のため
"src/api/app.py" = ["E402"]
"src/api/routes/fortune.py" = ["E402"]
"src/discord_bot.py" = ["E402"]
"src/scheduler/auto_poster.py" = ["E402"]
